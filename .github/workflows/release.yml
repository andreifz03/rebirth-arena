name: Build and Release Rebirth Arena

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Sync app version with release tag
        working-directory: desktop
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}".TrimStart("v")
          node -e "const fs=require('fs');const p=require('./package.json');p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" $version
          Write-Host "Building Rebirth Arena $version"

      - name: Build Windows installer
        working-directory: desktop
        run: npm run build:win -- --publish never

      - name: Verify release files
        shell: pwsh
        run: |
          $files = @(
            "desktop/dist/Rebirth-Arena-Setup.exe",
            "desktop/dist/Rebirth-Arena-Setup.exe.blockmap",
            "desktop/dist/latest.yml"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Required release file missing: $file"
            }
            Write-Host "OK: $file"
          }

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.tag_name }}
          files: |
            desktop/dist/Rebirth-Arena-Setup.exe
            desktop/dist/Rebirth-Arena-Setup.exe.blockmap
            desktop/dist/latest.yml
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
