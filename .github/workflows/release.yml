name: Build and Release Rebirth Arena

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Sync app version with tag
        working-directory: desktop
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          node -e "const fs=require('fs');const p=require('./package.json');p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" $version
          Write-Host "Building Rebirth Arena $version"

      - name: Build Windows installer
        working-directory: desktop
        run: npm run build:win -- --publish never

      - name: Verify updater assets
        shell: pwsh
        run: |
          $required = @(
            "desktop/dist/Rebirth-Arena-Setup.exe",
            "desktop/dist/Rebirth-Arena-Setup.exe.blockmap",
            "desktop/dist/latest.yml"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Missing required release asset: $file"
            }
            Write-Host "FOUND: $file"
          }

      - name: Create GitHub release and upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            "desktop/dist/Rebirth-Arena-Setup.exe" `
            "desktop/dist/Rebirth-Arena-Setup.exe.blockmap" `
            "desktop/dist/latest.yml" `
            --repo "${{ github.repository }}" `
            --title $tag `
            --generate-notes
